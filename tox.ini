[tox]
isolated_build = true
skip_missing_interpreters = true
parallel_show_output = true
envlist = 
    py{314,315}-dj{52,60,61,main}
work_dir = {toxinidir}/.dev/.tox

[testenv]
skip_install = true
description = Run tests and coverage. Optionally open the coverage reports
whitelist_externals =
    rm
deps =
    dj52: Django>=5.2,<6.0
    dj60: Django>=6.0,<6.1
    dj61: Django>=6.1,<6.2
    djmain: https://github.com/django/django/archive/main.tar.gz
setenv =
    DJANGO_SETTINGS_MODULE=tests.settings
    PYTHONHASHSEED=0
    PYTHONPATH={toxinidir}
commands =
    pip install -e .[test]
    coverage run {env:COVERAGE_OPTIONS:} -m pytest tests
    coverage report

[pytest]
DJANGO_SETTINGS_MODULE=tests.settings
django_find_project=false
pythonpath = .
addopts=-rf
cache_dir = ./.dev/.pytest_cache

[flake8]
ignore = E121,E123,E126,E226,E24,E704,W503,W504,E122
max-line-length = 100
exclude =
    picker/migrations

[gh-actions]
python =
    3.14: py314
    3.15: py315
